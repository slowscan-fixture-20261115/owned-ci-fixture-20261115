name: Owned boundary fixture

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  exercise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start synthetic endpoint
        run: |
          cat > "$RUNNER_TEMP/owned-endpoint.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  count = int(self.headers.get('Content-Length', '0'))
                  if count:
                      self.rfile.read(count)
                  path = self.path.split('?', 1)[0]
                  marker = self.headers.get('X-HackerOne-Handle', 'NULL')
                  print(f'OWNED_REQUEST method=POST path={path} handle={marker}', flush=True)
                  self.send_response(503)
                  self.end_headers()
                  self.wfile.write(b'owned stop')

              def log_message(self, *_args):
                  pass

          ThreadingHTTPServer(('127.0.0.1', 39877), Handler).serve_forever()
          PY
          python3 "$RUNNER_TEMP/owned-endpoint.py" > "$RUNNER_TEMP/owned-endpoint.log" 2>&1 &
          sleep 1
      - name: Exercise released action
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: owned-invalid-key
          prompt: Summarize the owned synthetic pull request in one sentence without changing files.
          claude_args: --max-turns 1
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:39877
          ANTHROPIC_CUSTOM_HEADERS: 'X-HackerOne-Handle: slowscan'
      - name: Show synthetic endpoint observation
        if: always()
        run: cat "$RUNNER_TEMP/owned-endpoint.log"
