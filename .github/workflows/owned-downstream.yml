name: Owned downstream provenance

on:
  workflow_run:
    workflows: [Owned upstream provenance]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Record synthetic downstream event
        env:
          ACTOR: ${{ github.actor }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "OWNED_DOWNSTREAM actor=$ACTOR run_actor=$RUN_ACTOR head_repo=$HEAD_REPO head_sha=$HEAD_SHA upstream_event=$UPSTREAM_EVENT conclusion=$UPSTREAM_CONCLUSION"
      - name: Start owned loopback endpoint
        run: |
          cat > "$RUNNER_TEMP/owned-endpoint.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  count = int(self.headers.get('Content-Length', '0'))
                  if count:
                      self.rfile.read(count)
                  path = self.path.split('?', 1)[0]
                  marker = self.headers.get('X-HackerOne-Handle', 'NULL')
                  print(f'OWNED_REQUEST method=POST path={path} handle={marker}', flush=True)
                  self.send_response(503)
                  self.end_headers()
                  self.wfile.write(b'owned stop')
              def log_message(self, *_args):
                  pass
          ThreadingHTTPServer(('127.0.0.1', 39877), Handler).serve_forever()
          PY
          python3 "$RUNNER_TEMP/owned-endpoint.py" > "$RUNNER_TEMP/owned-endpoint.log" 2>&1 &
          sleep 1
      - name: Exercise released Action provenance gate
        id: action_probe
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: owned-invalid-key
          prompt: Inspect only the synthetic owned provenance marker.
          claude_args: --max-turns 1
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:39877
          ANTHROPIC_CUSTOM_HEADERS: 'X-HackerOne-Handle: slowscan'
      - name: Record Action outcome
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.action_probe.outcome }}
        run: |
          echo "OWNED_ACTION_OUTCOME=$PROBE_OUTCOME"
          cat "$RUNNER_TEMP/owned-endpoint.log"
